<main>
  <div class="form-wrap">
    <div class="form-card">
      <h2>Регистрация аккаунта</h2>
      <p class="sub">Введите ваш игровой никнейм, чтобы получить одноразовый код для привязки на сервере.</p>
      
      <div class="field">
        <label for="reg-nick">Игровой никнейм</label>
        <input type="text" id="reg-nick" placeholder="Например: Steve" autocomplete="off" maxlength="16">
      </div>
      
      <button class="btn btn-primary full" id="reg-btn" onclick="doRegister()">Получить код</button>
      <div class="result" id="reg-result"></div>
      
      <p style="text-align:center; margin-top:24px; font-size:0.85rem; color:var(--text-muted);">
        Уже есть аккаунт? <a href="profile.html" style="color:var(--accent-primary); text-decoration:none;">Войти в кабинет</a>
      </p>
